<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar — Board Point</title>
<link rel="icon" href="../assets/img/logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/conta.css">
</head>
<body class="pagina-conta">

<main class="auth">
  <a class="auth__marca" href="../index.html"><img src="../assets/img/logo.jpg" alt="Logo Board Point"><span>Board <b>Point</b></span></a>

  <section class="auth__caixa">
    <h1>Cadastrar</h1>
    <p class="auth__sub">Crie sua conta para comprar na Board Point.</p>
    <div id="alerta" class="alerta" role="alert" hidden></div>

    <form id="formCadastro" novalidate>
      <div class="campo">
        <label for="campo-nome">Nome completo</label>
        <input id="campo-nome" class="campo__entrada" type="text" autocomplete="name" placeholder="Seu nome completo" maxlength="150" required>
        <small id="erro-nome" class="campo__erro"></small>
      </div>
      <div class="campo">
        <label for="campo-email">E-mail</label>
        <input id="campo-email" class="campo__entrada" type="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="150" required>
        <small id="erro-email" class="campo__erro"></small>
      </div>
      <div class="campo">
        <label for="campo-cpf">CPF</label>
        <input id="campo-cpf" class="campo__entrada" type="text" autocomplete="off" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required>
        <small id="erro-cpf" class="campo__erro"></small>
      </div>
      <div class="campo">
        <label for="campo-senha">Crie sua senha</label>
        <input id="campo-senha" class="campo__entrada" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
        <small id="erro-senha" class="campo__erro"></small>
      </div>
      <small class="campo__dica" style="margin-top:-8px;margin-bottom:14px">Use maiúscula, minúscula, número e símbolo.</small>
      <div class="campo">
        <label for="campo-confirmarSenha">Confirme a senha</label>
        <input id="campo-confirmarSenha" class="campo__entrada" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
        <small id="erro-confirmarSenha" class="campo__erro"></small>
      </div>
      <button id="botaoCadastrar" class="auth__botao" type="submit">Criar conta</button>
    </form>

    <p class="auth__troca">Já tem conta? <a href="login.html">Entrar</a></p>
  </section>

  <a class="auth__voltar" href="../index.html">&larr; Voltar à loja</a>
</main>

<script type="module" src="../js/cliente/paginaCadastro.js"></script>
</body>
</html>
