<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Board Point</title>
<link rel="icon" href="../assets/img/logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/conta.css">
</head>
<body class="pagina-conta">

<main class="auth">
  <a class="auth__marca" href="../index.html"><img src="../assets/img/logo.jpg" alt="Logo Board Point"><span>Board <b>Point</b></span></a>

  <section class="auth__caixa">
    <h1>Entrar</h1>
    <p class="auth__sub">Use o e-mail e a senha da sua conta.</p>
    <div id="alerta" class="alerta" role="alert" hidden></div>

    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="campo-email">E-mail</label>
        <input id="campo-email" class="campo__entrada" type="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="150" required>
        <small id="erro-email" class="campo__erro"></small>
      </div>
      <div class="campo">
        <label for="campo-senha">Senha</label>
        <input id="campo-senha" class="campo__entrada" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        <small id="erro-senha" class="campo__erro"></small>
      </div>
      <button id="botaoEntrar" class="auth__botao" type="submit">Entrar</button>
    </form>

    <p class="auth__troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </section>

  <a class="auth__voltar" href="../index.html">&larr; Voltar à loja</a>
</main>

<script type="module" src="../js/cliente/paginaLogin.js"></script>
</body>
</html>
