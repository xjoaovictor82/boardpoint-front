# Serve o build da SPA React (site público + painel admin, tudo no mesmo app)
# e as fotos/vídeos do site, que chegam por volume (ver docker-compose.yml).
#
# Atenção: a URL pública /assets/ é das FOTOS do site (front/assets), não do
# build. Por isso o Vite foi configurado (vite.config.ts: build.assetsDir) para
# gerar seu JS/CSS em /build-assets/ em vez de /assets/ — senão um dos dois
# "sumiria" (o volume de fotos sobrescreveria a pasta do build, ou vice-versa).
# As fotos chegam por volume em /var/www/site-assets e /var/www/produtos
# (caminhos que não existem dentro da imagem do build) e só viram /assets e
# /produtos através do "alias" abaixo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    # Fotos/vídeos do site (front/assets no repositório).
    location /assets/ {
        alias /var/www/site-assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fotos dos produtos, incluindo as enviadas pelo admin (front/produtos + volume uploads).
    location /produtos/ {
        alias /var/www/produtos/;
        try_files $uri =404;
    }

    # JS/CSS do build do Vite (nome com hash: pode ficar em cache por muito tempo).
    location /build-assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outra rota que não seja um arquivo real cai no index.html,
    # e o React Router decide o que mostrar (ex: acessar /admin/produtos
    # direto pela URL, ou dar F5 numa rota interna).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
