<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="produtos"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1 id="tituloFormulario">Novo produto</h1>
    </div>

    <div class="painel">
      <form id="formProduto" novalidate style="max-width:520px">
        <div class="campo-grupo">
          <label for="produtoNome">Nome</label>
          <input type="text" id="produtoNome" class="form-control" maxlength="150" required placeholder="Ex: Tênis Nike — Modelo 3">
        </div>
        <div class="campo-grupo">
          <label for="produtoCategoria">Categoria</label>
          <select id="produtoCategoria" class="form-select" required></select>
        </div>
        <div class="campo-grupo">
          <label for="produtoPreco">Preço (deixe vazio para "Consulte o valor")</label>
          <input type="number" id="produtoPreco" class="form-control" step="0.01" min="0" placeholder="Ex: 199.90">
        </div>
        <div class="campo-grupo">
          <label for="produtoEstoque">Estoque</label>
          <input type="number" id="produtoEstoque" class="form-control" min="0" value="0" required>
        </div>
        <div class="campo-grupo">
          <label for="produtoImagem">Imagem <span id="imagemObrigatoria">(obrigatória)</span></label>
          <input type="file" id="produtoImagem" class="form-control" accept="image/jpeg,image/png,image/webp">
          <img id="previewImagem" class="preview-imagem" alt="Pré-visualização">
        </div>
        <div class="modal-acoes" style="display:flex;gap:12px">
          <button type="button" class="botao-secundario" id="botaoCancelarProduto">Cancelar</button>
          <button type="submit" class="botao-primario btn" id="botaoSalvarProduto">Salvar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaProdutoForm.ts (compilado para js/admin/paginaProdutoForm.js) -->
<script type="module" src="../../js/admin/paginaProdutoForm.js"></script>

</body>
</html>
