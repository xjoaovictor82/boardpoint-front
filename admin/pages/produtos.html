<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="produtos"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Produtos</h1>
    </div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Todos os produtos</h2>
        <div class="controles-tabela">
          <input type="search" id="campoBusca" class="form-control" placeholder="Buscar por nome...">
          <select id="filtroCategoria" class="form-select">
            <option value="todos">Todas as categorias</option>
          </select>
          <button class="botao-novo" id="botaoNovoProduto">+ Novo produto</button>
        </div>
      </div>
      <table class="tabela-admin table table-dark table-hover align-middle">
        <thead>
          <tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th style="width:100px">Ações</th></tr>
        </thead>
        <tbody id="corpoProdutos">
          <tr><td colspan="6" class="estado-vazio">Carregando...</td></tr>
        </tbody>
      </table>
      <div class="paginacao" id="paginacaoProdutos"></div>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaProdutos.ts (compilado para js/admin/paginaProdutos.js) -->
<script type="module" src="../../js/admin/paginaProdutos.js"></script>

</body>
</html>
