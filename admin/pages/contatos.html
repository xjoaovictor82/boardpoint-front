<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagens — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="contatos"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Mensagens</h1>
    </div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Contatos recebidos pelo site</h2>
        <div class="controles-tabela">
          <span id="contagemContatos" style="color: var(--cinza); font-size: 0.85rem;"></span>
          <select id="filtroLida" class="form-select">
            <option value="">Todas</option>
            <option value="0">Não lidas</option>
            <option value="1">Lidas</option>
          </select>
          <button class="botao-novo" id="botaoNovoContato">+ Nova mensagem</button>
        </div>
      </div>
      <table class="tabela-admin table table-dark table-hover align-middle">
        <thead>
          <tr><th style="width:130px">Recebido em</th><th>Nome</th><th>E-mail</th><th>Mensagem</th><th style="width:120px">Ações</th></tr>
        </thead>
        <tbody id="corpoContatos">
          <tr><td colspan="5" class="estado-vazio">Carregando...</td></tr>
        </tbody>
      </table>
      <div class="paginacao" id="paginacaoContatos"></div>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaContatos.ts (compilado para js/admin/paginaContatos.js) -->
<script type="module" src="../../js/admin/paginaContatos.js"></script>

</body>
</html>
