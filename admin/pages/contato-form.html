<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagem — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="contatos"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1 id="tituloFormulario">Nova mensagem</h1>
    </div>

    <div class="painel">
      <form id="formContato" novalidate style="max-width:620px">
        <div class="campo-grupo">
          <label for="contatoNome">Nome</label>
          <input type="text" id="contatoNome" class="form-control" maxlength="150" required>
        </div>
        <div class="campo-grupo">
          <label for="contatoEmail">E-mail</label>
          <input type="email" id="contatoEmail" class="form-control" maxlength="150" required>
        </div>
        <div class="campo-grupo">
          <label for="contatoMensagem">Mensagem</label>
          <textarea id="contatoMensagem" class="form-control" rows="5" maxlength="5000" required></textarea>
        </div>
        <div class="campo-grupo">
          <label><input type="checkbox" id="contatoLida"> Marcar como lida</label>
        </div>
        <div class="modal-acoes" style="display:flex;gap:12px">
          <button type="button" class="botao-secundario" id="botaoCancelarContato">Cancelar</button>
          <button type="submit" class="botao-primario btn" id="botaoSalvarContato">Salvar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaContatoForm.ts (compilado para js/admin/paginaContatoForm.js) -->
<script type="module" src="../../js/admin/paginaContatoForm.js"></script>

</body>
</html>
