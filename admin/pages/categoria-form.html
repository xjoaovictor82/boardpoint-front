<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoria — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="categorias"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1 id="tituloFormulario">Nova categoria</h1>
    </div>

    <div class="painel">
      <form id="formCategoria" novalidate style="max-width:520px">
        <div class="campo-grupo">
          <label for="categoriaNome">Nome</label>
          <input type="text" id="categoriaNome" class="form-control" maxlength="100" required placeholder="Ex: Bonés">
        </div>
        <div class="campo-grupo">
          <label for="categoriaSlug">Slug (identificador, sem espaços)</label>
          <input type="text" id="categoriaSlug" class="form-control" maxlength="60" required placeholder="Ex: bones">
        </div>
        <div class="modal-acoes" style="display:flex;gap:12px">
          <button type="button" class="botao-secundario" id="botaoCancelarCategoria">Cancelar</button>
          <button type="submit" class="botao-primario btn" id="botaoSalvarCategoria">Salvar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaCategoriaForm.ts (compilado para js/admin/paginaCategoriaForm.js) -->
<script type="module" src="../../js/admin/paginaCategoriaForm.js"></script>

</body>
</html>
