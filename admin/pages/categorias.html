<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorias — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="categorias"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Categorias</h1>
    </div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Todas as categorias</h2>
        <div class="controles-tabela">
          <button class="botao-novo" id="botaoNovaCategoria">+ Nova categoria</button>
        </div>
      </div>
      <table class="tabela-admin table table-dark table-hover align-middle">
        <thead>
          <tr><th>Nome</th><th>Slug</th><th style="width:100px">Ações</th></tr>
        </thead>
        <tbody id="corpoCategorias">
          <tr><td colspan="3" class="estado-vazio">Carregando...</td></tr>
        </tbody>
      </table>
      <div class="paginacao" id="paginacaoCategorias"></div>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaCategorias.ts (compilado para js/admin/paginaCategorias.js) -->
<script type="module" src="../../js/admin/paginaCategorias.js"></script>

</body>
</html>
