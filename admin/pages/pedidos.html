<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Board Point Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-extras.css">
</head>
<body>

<div class="admin-layout">
  <div id="sidebarAdmin" data-ativo="pedidos"></div>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Pedidos</h1>
    </div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Pedidos</h2>
        <div class="controles-tabela">
          <span id="contagemPedidos" style="color: var(--cinza); font-size: 0.85rem;"></span>
          <select id="filtroStatus" class="form-select">
            <option value="">Todos os status</option>
            <option value="aguardando_pagamento">Aguardando PIX</option>
            <option value="pago">Pago</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <button class="botao-novo" id="botaoNovoPedido">+ Novo pedido</button>
        </div>
      </div>
      <table class="tabela-admin table table-dark table-hover align-middle">
        <thead>
          <tr><th style="width:110px">Código</th><th style="width:130px">Data</th><th>Cliente</th><th style="width:100px">Total</th><th style="width:130px">Status</th></tr>
        </thead>
        <tbody id="corpoPedidos">
          <tr><td colspan="5" class="estado-vazio">Carregando...</td></tr>
        </tbody>
      </table>
      <div class="paginacao" id="paginacaoPedidos"></div>
    </div>
  </main>
</div>

<!-- Código em TypeScript: ts/admin/paginaPedidos.ts (compilado para js/admin/paginaPedidos.js) -->
<script type="module" src="../../js/admin/paginaPedidos.js"></script>

</body>
</html>
