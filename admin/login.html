<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Board Point Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body>
    <div class="tela-login">
      <div class="cartao-login">
        <div class="marca">BOARD POINT</div>
        <div class="subtitulo">Painel administrativo</div>

        <div class="mensagem-erro" id="mensagem-status"></div>

        <form id="form-login">
          <div class="campo-grupo mb-3">
            <label for="login-email">E-mail</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-control"
              autocomplete="email"
              placeholder="admin@boardpoint.com"
              required
            />
          </div>
          <div class="campo-grupo mb-3">
            <label for="login-senha">Senha</label>
            <input
              type="password"
              id="login-senha"
              name="senha"
              class="form-control"
              autocomplete="current-password"
              required
            />
          </div>
          <button
            type="submit"
            class="botao-primario btn w-100"
            id="botaoEntrar"
          >
            Entrar
          </button>
        </form>

        <a href="../index.html" class="link-voltar-site mt-3 d-inline-block"
          >← Voltar ao site</a
        >
      </div>
    </div>

    <script type="module" src="../js/admin/paginaLoginAdmin.js"></script>
  </body>
</html>
